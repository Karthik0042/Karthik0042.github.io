{% comment %}
Slim spinning DNA strands fixed to the left and right edges of the page.
Shown only on wide screens (>= 1280px) where there is empty margin. Included from _layouts/default.html.
{% endcomment %}{% include base_path %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/dna.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<div class="dna-rail dna-rail--left" aria-hidden="true">
  <model-viewer src="{{ base_path }}/assets/models/dna.glb" alt="" auto-rotate auto-rotate-delay="0" rotation-per-second="16deg" camera-orbit="0deg 90deg 80%" camera-controls disable-zoom disable-pan interaction-prompt="none" environment-image="neutral" exposure="1.1" shadow-intensity="0" touch-action="pan-y" loading="lazy"></model-viewer>
</div>
<div class="dna-rail dna-rail--right" aria-hidden="true">
  <model-viewer src="{{ base_path }}/assets/models/dna.glb" alt="" auto-rotate auto-rotate-delay="0" rotation-per-second="-16deg" camera-orbit="180deg 90deg 80%" camera-controls disable-zoom disable-pan interaction-prompt="none" environment-image="neutral" exposure="1.1" shadow-intensity="0" touch-action="pan-y" loading="lazy"></model-viewer>
</div>
