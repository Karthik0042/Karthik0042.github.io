{% assign courses = site.courses | sort: "order" %}

<div class="courses-grid">
  {% for course in courses %}
    <a class="course-box" href="{{ course.url | relative_url }}">
      <span class="course-box__code">{{ course.code }}</span>
      <span class="course-box__name">{{ course.name }}</span>
    </a>
  {% endfor %}
</div>
